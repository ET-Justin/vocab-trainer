<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary Trainer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 20px 16px 50px;
    }

    h1 {
      margin: 5px 0 6px;
      text-align: center;
      font-size: 1.85rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .single-grid {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: #e9eef9;
      color: #222;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: default;
      opacity: 0.92;
    }

    .primary {
      background: #315efb;
      color: white;
    }

    .success {
      background: #2f9e44;
      color: white;
    }

    .secondary {
      background: #eef1f6;
    }

    .hidden {
      display: none !important;
    }

    .progress {
      font-size: 0.9rem;
      color: #666;
      text-align: right;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .small-note {
      font-size: 0.86rem;
      color: #777;
      line-height: 1.55;
    }

    .word {
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      margin: 24px 0 14px;
      word-break: keep-all;
    }

    .meaning {
      font-size: 1.35rem;
      text-align: center;
      margin: 18px 0;
      font-weight: 700;
    }

    .example {
      border-top: 1px solid #eee;
      padding-top: 16px;
      font-size: 1rem;
      line-height: 1.65;
      color: #444;
    }

    .example-ko {
      margin-top: 8px;
      font-size: 0.94rem;
      color: #777;
      line-height: 1.55;
    }

    .flashcard {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .tap-hint {
      text-align: center;
      color: #999;
      font-size: 0.85rem;
      margin-top: 12px;
    }

    .choice {
      margin-top: 10px;
      background: #f1f3f5;
      text-align: left;
      font-weight: 600;
    }

    .choice.correct {
      background: #d3f9d8;
      color: #2b8a3e;
    }

    .choice.wrong {
      background: #ffe3e3;
      color: #c92a2a;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      border: 2px solid #ddd;
      border-radius: 12px;
      margin: 12px 0;
    }

    input:focus {
      outline: none;
      border-color: #315efb;
    }

    .feedback {
      padding: 12px;
      margin: 12px 0;
      border-radius: 12px;
      font-weight: 700;
      text-align: center;
    }

    .feedback.good {
      background: #d3f9d8;
      color: #2b8a3e;
    }

    .feedback.bad {
      background: #ffe3e3;
      color: #c92a2a;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .report {
      text-align: center;
    }

    .rank-icon {
      font-size: 4rem;
      margin: 10px 0;
    }

    .rank-title {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .score {
      font-size: 2.4rem;
      font-weight: 900;
      margin: 15px 0 4px;
    }

    .review-box {
      text-align: left;
      margin-top: 22px;
      padding: 17px;
      background: #f7f8fb;
      border-radius: 15px;
    }

    .review-word {
      padding: 5px 0;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 18px 0;
    }

    .unscramble {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.22rem;
      margin: 18px 0;
      line-height: 1.8;
    }

    .question-label {
      text-align: center;
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 8px;
    }

    @media (max-width: 430px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.55rem;
      }

      .word {
        font-size: 1.75rem;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <!-- GRADE SELECT -->
  <section id="gradeScreen">
    <h1>📚 Vocabulary Trainer</h1>
    <div class="subtitle">Choose Your Grade</div>

    <div class="card single-grid">
      <button onclick="selectGrade(1)">Grade 1</button>
      <button onclick="selectGrade(2)">Grade 2</button>
      <button onclick="selectGrade(3)">Grade 3</button>
    </div>
  </section>


  <!-- LESSON SELECT -->
  <section id="lessonScreen" class="hidden">
    <h1 id="gradeTitle"></h1>
    <div class="subtitle">Choose a Lesson</div>

    <div class="card">
      <div id="lessonLoading" class="loading">
        🔎 Looking for lessons...
      </div>

      <div id="lessonButtons" class="single-grid"></div>
    </div>

    <button class="secondary" onclick="backToGrades()">
      ← Back to Grade
    </button>
  </section>


  <!-- HOME -->
  <section id="homeScreen" class="hidden">
    <h1 id="lessonTitle"></h1>
    <div class="subtitle" id="lessonSubtitle"></div>

    <div class="card">
      <div class="menu-grid">
        <button onclick="startFlashcards()">
          🃏 Flashcards
        </button>

        <button onclick="startPractice()">
          🎯 Practice
        </button>

        <button onclick="startTest()">
          👑 Test Yourself
        </button>
      </div>
    </div>

    <div class="card small-note">
      💡 <strong>추천 학습 순서</strong><br>
      Flashcards → Practice → Test Yourself
    </div>

    <button class="secondary" onclick="backToLessons()">
      ← Lessons
    </button>
  </section>


  <!-- FLASHCARDS -->
  <section id="flashScreen" class="hidden">

    <div class="progress" id="flashProgress"></div>

    <div class="card flashcard" onclick="flipCard()">

      <div class="word" id="flashWord"></div>

      <div id="flashBack" class="hidden">
        <div class="meaning" id="flashMeaning"></div>

        <div class="example">
          <div id="flashExample"></div>
          <div class="example-ko" id="flashExampleKo"></div>
        </div>
      </div>

      <div class="tap-hint" id="tapHint">
        카드를 눌러 뜻과 예문을 확인하세요.
      </div>

    </div>

    <div class="button-row">
      <button onclick="previousFlash()">← Previous</button>
      <button class="primary" onclick="nextFlash()">Next →</button>
    </div>

    <button
      class="secondary"
      style="margin-top:10px;"
      onclick="showLessonHome()"
    >
      ← Lesson Menu
    </button>
  </section>


  <!-- PRACTICE -->
  <section id="practiceScreen" class="hidden">

    <div class="progress" id="practiceProgress"></div>

    <div class="card">
      <div class="question-label">Choose the correct meaning.</div>

      <div class="word" id="practiceWord"></div>

      <div id="practiceChoices"></div>

      <div id="practiceFeedback"></div>

      <button
        id="practiceNext"
        class="primary hidden"
        onclick="nextPractice()"
      >
        Next →
      </button>
    </div>
  </section>


  <!-- PRACTICE COMPLETE -->
  <section id="practiceCompleteScreen" class="hidden">
    <div class="card report">
      <div class="rank-icon">🎉</div>
      <div class="rank-title">Practice Complete!</div>

      <p id="practiceCompleteText"></p>

      <button class="primary" onclick="showLessonHome()">
        ← Lesson Menu
      </button>
    </div>
  </section>


  <!-- TEST -->
  <section id="testScreen" class="hidden">

    <div class="progress" id="testProgress"></div>

    <div class="card">

      <div class="question-label" id="testTypeLabel"></div>

      <div id="testQuestion"></div>

      <div id="testChoices"></div>

      <div id="testInputArea"></div>

      <div id="testFeedback"></div>

      <button
        id="testNext"
        class="primary hidden"
        onclick="nextTest()"
      >
        Next →
      </button>

    </div>
  </section>


  <!-- RESULT -->
  <section id="resultScreen" class="hidden">
    <div class="card report">

      <div class="rank-icon" id="rankIcon"></div>

      <div class="rank-title" id="rankTitle"></div>

      <div class="score" id="finalScore"></div>

      <div id="accuracy"></div>

      <div class="review-box">
        <h3>📚 Words to Review</h3>
        <div id="reviewList"></div>
      </div>

      <button
        class="success"
        style="margin-top:18px;"
        onclick="copyResult()"
      >
        📋 Copy Result
      </button>

      <button
        class="primary"
        style="margin-top:10px;"
        onclick="startTest()"
      >
        🔄 Try Again
      </button>

      <button
        class="secondary"
        style="margin-top:10px;"
        onclick="showLessonHome()"
      >
        ← Lesson Menu
      </button>

    </div>
  </section>

</div>


<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let currentGrade = null;
let currentLesson = null;
let vocabulary = [];

const MAX_LESSON_NUMBER = 20;


/* =========================================================
   UTILITIES
========================================================= */

function hideAllScreens() {
  document.querySelectorAll("section").forEach(section => {
    section.classList.add("hidden");
  });
}

function showScreen(id) {
  hideAllScreens();
  document.getElementById(id).classList.remove("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function shuffle(array) {
  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function normalize(text) {
  return text
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function highlightTarget(example, word) {
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escaped})`, "gi");

  return escapeHtml(example).replace(
    regex,
    "<strong>$1</strong>"
  );
}


/* =========================================================
   GRADE / LESSON NAVIGATION
========================================================= */

async function selectGrade(grade) {
  currentGrade = grade;

  document.getElementById("gradeTitle").textContent =
    `Grade ${grade}`;

  document.getElementById("lessonButtons").innerHTML = "";
  document.getElementById("lessonLoading").classList.remove("hidden");

  showScreen("lessonScreen");

  await discoverLessons();
}

async function discoverLessons() {
  const foundLessons = [];

  const checks = [];

  for (let lesson = 1; lesson <= MAX_LESSON_NUMBER; lesson++) {
    checks.push(checkLessonExists(lesson));
  }

  const results = await Promise.all(checks);

  results.forEach((exists, index) => {
    if (exists) {
      foundLessons.push(index + 1);
    }
  });

  renderLessonButtons(foundLessons);
}

async function checkLessonExists(lesson) {
  const path =
    `data/grade${currentGrade}/lesson${lesson}.csv`;

  try {
    const response = await fetch(path, {
      cache: "no-store"
    });

    return response.ok;

  } catch (error) {
    return false;
  }
}

function renderLessonButtons(lessons) {
  const box = document.getElementById("lessonButtons");
  const loading = document.getElementById("lessonLoading");

  loading.classList.add("hidden");
  box.innerHTML = "";

  if (lessons.length === 0) {
    box.innerHTML = `
      <div class="small-note">
        아직 등록된 Lesson이 없습니다.
      </div>
    `;
    return;
  }

  lessons.forEach(lesson => {
    const button = document.createElement("button");

    button.textContent = `Lesson ${lesson}`;

    button.onclick = () => loadLesson(lesson);

    box.appendChild(button);
  });
}

async function loadLesson(lesson) {
  currentLesson = lesson;

  const path =
    `data/grade${currentGrade}/lesson${lesson}.csv`;

  try {
    const response = await fetch(path, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("CSV could not be loaded.");
    }

    const csvText = await response.text();

    vocabulary = parseCSV(csvText);

    if (vocabulary.length === 0) {
      throw new Error("No vocabulary data found.");
    }

    document.getElementById("lessonTitle").textContent =
      `📚 Grade ${currentGrade} · Lesson ${currentLesson}`;

    document.getElementById("lessonSubtitle").textContent =
      `${vocabulary.length} Words`;

    showLessonHome();

  } catch (error) {
    alert(
      "CSV 파일을 불러오지 못했습니다.\n" +
      "파일 경로와 CSV 형식을 확인해주세요."
    );

    console.error(error);
  }
}

function backToGrades() {
  currentGrade = null;
  currentLesson = null;
  vocabulary = [];

  showScreen("gradeScreen");
}

function backToLessons() {
  currentLesson = null;
  vocabulary = [];

  showScreen("lessonScreen");
}

function showLessonHome() {
  showScreen("homeScreen");
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      cell += '"';
      i++;
    }

    else if (char === '"') {
      insideQuotes = !insideQuotes;
    }

    else if (char === "," && !insideQuotes) {
      row.push(cell);
      cell = "";
    }

    else if (
      (char === "\n" || char === "\r") &&
      !insideQuotes
    ) {
      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell);

      if (row.some(value => value.trim() !== "")) {
        rows.push(row);
      }

      row = [];
      cell = "";
    }

    else {
      cell += char;
    }
  }

  if (cell.length > 0 || row.length > 0) {
    row.push(cell);
    rows.push(row);
  }

  if (rows.length < 2) {
    return [];
  }

  const headers = rows[0].map(header =>
    header
      .replace(/^\uFEFF/, "")
      .trim()
      .toLowerCase()
  );

  const wordIndex = headers.indexOf("word");
  const meaningIndex = headers.indexOf("meaning");
  const exampleIndex = headers.indexOf("example");
  const exampleKoIndex = headers.indexOf("example_ko");

  if (
    wordIndex === -1 ||
    meaningIndex === -1 ||
    exampleIndex === -1
  ) {
    throw new Error(
      "CSV headers must include word, meaning, example."
    );
  }

  return rows
    .slice(1)
    .map(row => ({
      word: (row[wordIndex] || "").trim(),
      meaning: (row[meaningIndex] || "").trim(),
      example: (row[exampleIndex] || "").trim(),
      example_ko:
        exampleKoIndex >= 0
          ? (row[exampleKoIndex] || "").trim()
          : ""
    }))
    .filter(item => item.word && item.meaning);
}


/* =========================================================
   FLASHCARDS
========================================================= */

let flashList = [];
let flashIndex = 0;
let flashFlipped = false;

function startFlashcards() {
  flashList = [...vocabulary];
  flashIndex = 0;

  showScreen("flashScreen");
  showFlashcard();
}

function showFlashcard() {
  flashFlipped = false;

  const item = flashList[flashIndex];

  document.getElementById("flashWord").textContent =
    item.word;

  document.getElementById("flashMeaning").textContent =
    item.meaning;

  document.getElementById("flashExample").innerHTML =
    highlightTarget(item.example, item.word);

  document.getElementById("flashExampleKo").textContent =
    item.example_ko || "";

  document.getElementById("flashBack")
    .classList.add("hidden");

  document.getElementById("tapHint")
    .classList.remove("hidden");

  document.getElementById("flashProgress").textContent =
    `${flashIndex + 1} / ${flashList.length}`;
}

function flipCard() {
  flashFlipped = !flashFlipped;

  const back = document.getElementById("flashBack");
  const hint = document.getElementById("tapHint");

  if (flashFlipped) {
    back.classList.remove("hidden");
    hint.classList.add("hidden");
  } else {
    back.classList.add("hidden");
    hint.classList.remove("hidden");
  }
}

function nextFlash() {
  if (flashIndex < flashList.length - 1) {
    flashIndex++;
    showFlashcard();
  } else {
    showLessonHome();
  }
}

function previousFlash() {
  if (flashIndex > 0) {
    flashIndex--;
    showFlashcard();
  }
}


/* =========================================================
   PRACTICE
========================================================= */

let practiceQueue = [];
let practiceAttempts = {};
let practiceCurrent = null;
let practiceAnswered = false;
let practiceInitialCount = 0;

function startPractice() {
  practiceQueue = shuffle([...vocabulary]);
  practiceAttempts = {};
  practiceAnswered = false;
  practiceInitialCount = vocabulary.length;

  vocabulary.forEach(item => {
    practiceAttempts[item.word] = 0;
  });

  showScreen("practiceScreen");

  showPracticeQuestion();
}

function showPracticeQuestion() {
  if (practiceQueue.length === 0) {
    finishPractice();
    return;
  }

  practiceAnswered = false;

  practiceCurrent = practiceQueue.shift();

  practiceAttempts[practiceCurrent.word]++;

  const currentAttempt =
    practiceAttempts[practiceCurrent.word];

  document.getElementById("practiceWord").textContent =
    practiceCurrent.word;

  document.getElementById("practiceProgress").textContent =
    `Attempt ${currentAttempt} of 3`;

  document.getElementById("practiceFeedback").innerHTML = "";

  document.getElementById("practiceNext")
    .classList.add("hidden");

  const otherMeanings = vocabulary
    .filter(v => v.word !== practiceCurrent.word)
    .map(v => v.meaning);

  const wrongChoices =
    shuffle(otherMeanings).slice(0, 3);

  const choices = shuffle([
    practiceCurrent.meaning,
    ...wrongChoices
  ]);

  const box =
    document.getElementById("practiceChoices");

  box.innerHTML = "";

  choices.forEach(choice => {
    const button = document.createElement("button");

    button.className = "choice";
    button.textContent = choice;

    button.onclick = () =>
      answerPractice(button, choice);

    box.appendChild(button);
  });
}

function answerPractice(button, selected) {
  if (practiceAnswered) return;

  practiceAnswered = true;

  const buttons =
    document.querySelectorAll("#practiceChoices .choice");

  buttons.forEach(btn => {
    btn.disabled = true;

    if (btn.textContent === practiceCurrent.meaning) {
      btn.classList.add("correct");
    }
  });

  if (selected === practiceCurrent.meaning) {
    document.getElementById("practiceFeedback").innerHTML =
      `<div class="feedback good">
        ⭐ Correct!
      </div>`;

  } else {
    button.classList.add("wrong");

    const attempts =
      practiceAttempts[practiceCurrent.word];

    if (attempts < 3) {
      practiceQueue.push(practiceCurrent);

      document.getElementById("practiceFeedback").innerHTML =
        `<div class="feedback bad">
          📚 ${escapeHtml(practiceCurrent.word)}
          = ${escapeHtml(practiceCurrent.meaning)}
          <br>
          You will see this word again.
        </div>`;
    } else {
      document.getElementById("practiceFeedback").innerHTML =
        `<div class="feedback bad">
          📚 ${escapeHtml(practiceCurrent.word)}
          = ${escapeHtml(practiceCurrent.meaning)}
          <br>
          Maximum 3 tries reached.
        </div>`;
    }
  }

  document.getElementById("practiceNext")
    .classList.remove("hidden");
}

function nextPractice() {
  showPracticeQuestion();
}

function finishPractice() {
  showScreen("practiceCompleteScreen");

  document.getElementById("practiceCompleteText").textContent =
    `You practiced all ${practiceInitialCount} words.`;
}


/* =========================================================
   TEST YOURSELF
========================================================= */

const TEST_TYPES = [
  "en_to_ko",
  "ko_to_en",
  "unscramble",
  "spelling",
  "example_gap"
];

let testQuestions = [];
let testIndex = 0;
let testScore = 0;
let testWrongWords = new Set();
let testAnswered = false;
let currentTestQuestion = null;
let lastReportText = "";

function startTest() {
  testQuestions = buildBalancedTest();

  testIndex = 0;
  testScore = 0;
  testWrongWords = new Set();

  showScreen("testScreen");

  showTestQuestion();
}

function buildBalancedTest() {
  const words = shuffle([...vocabulary]);

  let types = [];

  for (let i = 0; i < words.length; i++) {
    types.push(
      TEST_TYPES[i % TEST_TYPES.length]
    );
  }

  types = shuffle(types);

  return words.map((item, index) => ({
    item,
    type: types[index]
  }));
}

function showTestQuestion() {
  testAnswered = false;

  currentTestQuestion = testQuestions[testIndex];

  const item = currentTestQuestion.item;
  const type = currentTestQuestion.type;

  document.getElementById("testProgress").textContent =
    `${testIndex + 1} / ${testQuestions.length}`;

  document.getElementById("testQuestion").innerHTML = "";
  document.getElementById("testChoices").innerHTML = "";
  document.getElementById("testInputArea").innerHTML = "";
  document.getElementById("testFeedback").innerHTML = "";

  document.getElementById("testNext")
    .classList.add("hidden");

  if (type === "en_to_ko") {
    renderEnglishToKorean(item);
  }

  else if (type === "ko_to_en") {
    renderKoreanToEnglish(item);
  }

  else if (type === "unscramble") {
    renderUnscramble(item);
  }

  else if (type === "spelling") {
    renderSpelling(item);
  }

  else if (type === "example_gap") {
    renderExampleGap(item);
  }
}


/* ---------- TYPE 1 ---------- */

function renderEnglishToKorean(item) {
  document.getElementById("testTypeLabel").textContent =
    "Choose the correct meaning.";

  document.getElementById("testQuestion").innerHTML =
    `<div class="word">${escapeHtml(item.word)}</div>`;

  const distractors = shuffle(
    vocabulary
      .filter(v => v.word !== item.word)
      .map(v => v.meaning)
  ).slice(0, 3);

  renderTestChoices(
    shuffle([item.meaning, ...distractors]),
    item.meaning
  );
}


/* ---------- TYPE 2 ---------- */

function renderKoreanToEnglish(item) {
  document.getElementById("testTypeLabel").textContent =
    "Choose the correct English word.";

  document.getElementById("testQuestion").innerHTML =
    `<div class="meaning">${escapeHtml(item.meaning)}</div>`;

  const distractors = shuffle(
    vocabulary
      .filter(v => v.word !== item.word)
      .map(v => v.word)
  ).slice(0, 3);

  renderTestChoices(
    shuffle([item.word, ...distractors]),
    item.word
  );
}


/* ---------- TYPE 3 ---------- */

function renderUnscramble(item) {
  document.getElementById("testTypeLabel").textContent =
    "Unscramble the word.";

  const scrambled = scrambleWord(item.word);

  document.getElementById("testQuestion").innerHTML = `
    <div class="meaning">
      ${escapeHtml(item.meaning)}
    </div>

    <div class="unscramble">
      ${escapeHtml(scrambled)}
    </div>
  `;

  renderTextInput(item.word);
}

function scrambleWord(word) {
  const compact = word.replace(/\s/g, "");

  if (compact.length <= 2) {
    return compact.split("").reverse().join(" ");
  }

  let scrambled = compact;

  let safety = 0;

  while (
    normalize(scrambled) === normalize(compact) &&
    safety < 20
  ) {
    scrambled =
      shuffle(compact.split("")).join("");

    safety++;
  }

  return scrambled.split("").join(" ");
}


/* ---------- TYPE 4 ---------- */

function renderSpelling(item) {
  document.getElementById("testTypeLabel").textContent =
    "Write the English word.";

  document.getElementById("testQuestion").innerHTML =
    `<div class="meaning">${escapeHtml(item.meaning)}</div>`;

  renderTextInput(item.word);
}


/* ---------- TYPE 5 ---------- */

function renderExampleGap(item) {
  document.getElementById("testTypeLabel").textContent =
    "Choose the word that completes the sentence.";

  const escaped =
    item.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  const regex =
    new RegExp(escaped, "gi");

  const sentence =
    item.example.replace(regex, "________");

  document.getElementById("testQuestion").innerHTML =
    `<div class="example" style="border-top:none;">
      ${escapeHtml(sentence)}
    </div>`;

  const distractors = shuffle(
    vocabulary
      .filter(v => v.word !== item.word)
      .map(v => v.word)
  ).slice(0, 3);

  renderTestChoices(
    shuffle([item.word, ...distractors]),
    item.word
  );
}


/* =========================================================
   TEST ANSWERING
========================================================= */

function renderTestChoices(choices, correctAnswer) {
  const box =
    document.getElementById("testChoices");

  choices.forEach(choice => {
    const button =
      document.createElement("button");

    button.className = "choice";
    button.textContent = choice;

    button.onclick = () =>
      answerTestChoice(
        button,
        choice,
        correctAnswer
      );

    box.appendChild(button);
  });
}

function answerTestChoice(
  button,
  selected,
  correctAnswer
) {
  if (testAnswered) return;

  testAnswered = true;

  const buttons =
    document.querySelectorAll("#testChoices .choice");

  buttons.forEach(btn => {
    btn.disabled = true;

    if (
      normalize(btn.textContent) ===
      normalize(correctAnswer)
    ) {
      btn.classList.add("correct");
    }
  });

  const correct =
    normalize(selected) ===
    normalize(correctAnswer);

  registerTestResult(correct, button);
}

function renderTextInput(correctAnswer) {
  const area =
    document.getElementById("testInputArea");

  area.innerHTML = `
    <input
      id="testTextInput"
      type="text"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Type your answer..."
    >

    <button
      id="testCheckButton"
      class="primary"
      onclick="answerTestInput(
        ${JSON.stringify(correctAnswer)}
      )"
    >
      Check
    </button>
  `;

  const input =
    document.getElementById("testTextInput");

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      if (!testAnswered) {
        answerTestInput(correctAnswer);
      } else {
        nextTest();
      }
    }
  });

  setTimeout(() => input.focus(), 100);
}

function answerTestInput(correctAnswer) {
  if (testAnswered) return;

  const input =
    document.getElementById("testTextInput");

  const answer = input.value;

  if (normalize(answer) === "") return;

  testAnswered = true;
  input.disabled = true;

  const checkButton =
    document.getElementById("testCheckButton");

  if (checkButton) {
    checkButton.classList.add("hidden");
  }

  const correct =
    normalize(answer) ===
    normalize(correctAnswer);

  registerTestResult(correct);
}

function registerTestResult(correct, wrongButton = null) {
  const item =
    currentTestQuestion.item;

  if (correct) {
    testScore++;

    document.getElementById("testFeedback").innerHTML =
      `<div class="feedback good">
        ⭐ Correct!
      </div>`;

  } else {
    testWrongWords.add(item.word);

    if (wrongButton) {
      wrongButton.classList.add("wrong");
    }

    document.getElementById("testFeedback").innerHTML =
      `<div class="feedback bad">
        📚 Answer: ${escapeHtml(item.word)}
      </div>`;
  }

  document.getElementById("testNext")
    .classList.remove("hidden");
}

function nextTest() {
  testIndex++;

  if (testIndex < testQuestions.length) {
    showTestQuestion();
  } else {
    showResult();
  }
}


/* =========================================================
   RESULT
========================================================= */

function showResult() {
  showScreen("resultScreen");

  const total =
    testQuestions.length;

  const percent =
    Math.round((testScore / total) * 100);

  let icon;
  let title;

  if (percent === 100) {
    icon = "👑";
    title = "Vocabulary Master!";
  }

  else if (percent >= 90) {
    icon = "🌟";
    title = "Vocabulary Star!";
  }

  else if (percent >= 80) {
    icon = "⭐";
    title = "Great Job!";
  }

  else if (percent >= 70) {
    icon = "💪";
    title = "Almost There!";
  }

  else {
    icon = "🌱";
    title = "Keep Growing!";
  }

  document.getElementById("rankIcon").textContent =
    icon;

  document.getElementById("rankTitle").textContent =
    title;

  document.getElementById("finalScore").textContent =
    `${testScore} / ${total}`;

  document.getElementById("accuracy").textContent =
    `🎯 Accuracy: ${percent}%`;

  const reviewBox =
    document.getElementById("reviewList");

  const reviewWords =
    [...testWrongWords];

  if (reviewWords.length === 0) {
    reviewBox.innerHTML =
      "🎉 Perfect! No words to review.";
  } else {
    reviewBox.innerHTML =
      reviewWords
        .map(word =>
          `<div class="review-word">
            • ${escapeHtml(word)}
          </div>`
        )
        .join("");
  }

  const reviewText =
    reviewWords.length === 0
      ? "None 🎉"
      : reviewWords.join(", ");

  lastReportText =
`${icon} ${title}
📚 Grade ${currentGrade} · Lesson ${currentLesson}
⭐ Score: ${testScore}/${total}
🎯 Accuracy: ${percent}%

📖 Words to Review:
${reviewText}`;
}


/* =========================================================
   COPY
========================================================= */

async function copyResult() {
  try {
    await navigator.clipboard.writeText(
      lastReportText
    );

    alert(
      "📋 결과가 복사되었습니다!\nPadlet에 붙여넣으세요."
    );

  } catch (error) {
    const textarea =
      document.createElement("textarea");

    textarea.value =
      lastReportText;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    document.body.removeChild(textarea);

    alert("📋 결과가 복사되었습니다!");
  }
}
